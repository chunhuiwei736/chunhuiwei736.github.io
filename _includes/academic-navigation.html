<nav class="academic-page-nav" aria-label="Page navigation">
  <p class="academic-page-nav__label">Explore</p>
  <ul>
    <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
    {% for link in site.data.navigation.main %}
      <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
    {% endfor %}
  </ul>
</nav>
